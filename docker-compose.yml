version: "3.8"

services:
  freebuff2api:
    build: .
    container_name: freebuff2api
    restart: unless-stopped
    ports:
      - "8877:8787"
    environment:
      - PORT=8787
      - HOST=0.0.0.0
      # 上游地址：默认空=直连官方 www.codebuff.com；如走自建中继可设为中继域名
      - CODEBUFF_API=
      - RELAY_KEY=${RELAY_KEY}
      - FREEBUFF_API_KEY=${FREEBUFF_API_KEY:-freebuff-default-key}
      - FREEBUFF_DEBUG=false
      # 每账号代理出口：当前直接复用宿主机 Clash Verge 混合端口
      # （host.docker.internal:7890，需 Clash 开启"允许局域网连接"）。
      # PROXY_REGIONS 决定账号哈希绑定的区域；走单一混合端口时只保留 US。
      - PROXY_ENABLED=${PROXY_ENABLED:-1}
      - PROXY_HOST=${PROXY_HOST:-host.docker.internal}
      - PROXY_PORT_BASE=${PROXY_PORT_BASE:-7890}
      - PROXY_REGIONS=${PROXY_REGIONS:-US}
      # admin 面板（/admin）访问密钥；为空则本地开放
      - ADMIN_KEY=${ADMIN_KEY:-}
    volumes:
      - ./credentials:/app/credentials
      - ./worker.js:/app/worker.js:ro
