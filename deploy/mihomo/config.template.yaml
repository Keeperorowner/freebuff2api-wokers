# freebuff2api 每账号出口路由模板
# 由 scripts/gen-mihomo-config.mjs 从 .env 读取 SUB_URL / PROXY_REGIONS /
# PROXY_PORT_BASE 生成 deploy/mihomo/config.yaml；生成的文件含订阅地址，不入库。
#
# 结构：订阅经 proxy-provider 导入 → 每个区域一个 url-test 组（自动选延迟最低
# 节点）→ 每个区域一个独立 HTTP 监听端口。worker.js 按账号哈希绑定区域端口，
# 同账号永远同一出口 IP。
mode: rule
log-level: warning
external-controller: 0.0.0.0:9090
unified-delay: true

# 容器内必须自带 DNS：否则 mihomo 用容器系统 DNS（国内污染）解析节点域名，
# 节点全部解析到错误 IP → "节点不可用"。与宿主机 Clash Verge 可用的差别就在这。
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.home.arpa"
    - "time.*.com"
    - "ntp.*.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 节点域名防污染解析（关键）
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

proxy-providers:
  westdata:
    type: http
    url: "__SUB_URL__"
    interval: 86400
    path: ./providers/westdata.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600

proxy-groups: []

listeners: []

rules:
  - MATCH,DIRECT
